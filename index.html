    <div class="container-head">
    <h1><i class="fas fa-circle" style="color: red; font-size: 65px"></i> Reel Recs</h1>
</div>
<!-- the red circle is supposed to align with the Reel Recs title, mimicking record button on a camera or remote-->
    
<div class="container"> 
    <select id="mood" class="dropdown" name="mood">
        <option selected disabled>Choose your mood</option>
        <!-- selected disabled is to ensure the default option is "Choose your mood"-->
        <option value="A">Cheeky</option>
        <option value="B">Disillusioned</option>
        <option value="C">Fragile</option>
    </select>
    
    <select id="genre" class="dropdown" name="genre">
        <option selected disabled>Choose a genre</option>
          <!-- selected disabled is to ensure the default option is "Choose your genre"-->
        <option value="V">Coming of Age</option>
        <option value="W">Drama</option>
        <option value="X">Kissing</option>
        <option value="Y">Thriller</option>
        <option value="Z">War</option>
        <option value="U">Sci-Fi</option>
    </select>
     <div class="button-container">
        <button class="button" onclick="showResult()"> <i class="fas fa-circle" style="font-size: 18px; color: red"></i> Rec</button>
        <!-- rec button acts as show results button with double entendre of recommend and record, pressing this button again will give the user the alternative result for the chosen variables -->
    </div>
   </div>
   <!-- each mood and genre value is assigned a letter (A-C; V-Z, respectively), each pair of values produces 1 of 2 results (movie results) that align with selected values-->

   
    <div id="result" class="result-container">
        <div class="result-item">
            <img src="" class = "result-image">
            <div class="result-text">

                <h3 class="result-year"></h3>
                <h4 class="result-runtime"></h4>
                <h5 class="result-starring"></h5>
                <p class="result-description"></p>

    </div>

            let randomIndex = Math.floor(Math.random() * outcomes[key].length);
            let chosenResult= outcomes[key][randomIndex];
            //the math.random is set to pick from 2 since there are only 2 potential results for each pair of values, but if/when the website is updated to include more potential films I will change this to outcomes[key].length
            
            resultDiv.innerHTML = `
            <div class="result-item">
                ${chosenResult.image ?` <img src="${chosenResult.image}"  class="result-image" />`:''}
                <div class="result-text">
                    <h2 class="result-title">${chosenResult.title ?? ''}</h2>
                    <h3 class="result-year">${chosenResult.year ?? ''}</h3>
                    ${chosenResult.starring ? `
                        <h4 class="result-starring"> <i class= "fas fa-star" style="font-size: 18px"> </i> ${chosenResult.starring}</h4>
                    `:''}
                    ${chosenResult.director ? `
                        <h4 class="result-director"> <i class="fa fa-video-camera" aria-hidden="true" style="font-size: 18px"> </i> ${chosenResult.director}</h4>
                    `:''}
                    
                    ${chosenResult.runtime ? `
                        <h5 class="result-runtime"> <i class="fas fa-clock" style="font-size: 18px"> </i> ${chosenResult.runtime} </h5>
                    `:''}
                    
                    ${chosenResult.description ?`
                        <p class="result-description"> <i class="fas fa-film" style="font-size: 18px"> </i> ${chosenResult.description}</p>
                    `:''}
                    
                </div>
            </div>
        `;
        // each descriptive element is preceded by an icon that intuitively describes the descriptive element, the icon formats are styled inline here for no particular reason

    } else {
        resultDiv.innerHTML = `
        <div class="result-error" style="text-align: center; padding: 20px;"> 
            <p> <i class= "fas fa-exclamation-triangle" style="font-size: 36px; color: #ccc; "></i> We're not done watching movies! Come back later for a suggestion. Please choose a different mood or genre. </p>
        </div>
      `;

    }
    }, 1200);
}
        
</script>     
</body>
